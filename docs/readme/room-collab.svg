<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Middot 房间协作，邀请朋友同步填写出发地</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430"><stop stop-color="#0C1A2A"/><stop offset=".55" stop-color="#102C47"/><stop offset="1" stop-color="#18345C"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#52D4B7"/><stop offset="1" stop-color="#1BA6D8"/></linearGradient><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFAE7A"/><stop offset="1" stop-color="#9B74F4"/></linearGradient><linearGradient id="ami" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83BEFF"/><stop offset=".48" stop-color="#3188F5"/><stop offset="1" stop-color="#6357D9"/></linearGradient><filter id="shadow"><feDropShadow dy="10" stdDeviation="16" flood-color="#00101F" flood-opacity=".28"/></filter><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="white" fill-opacity=".11"/></pattern></defs>
  <rect width="1200" height="430" rx="34" fill="url(#bg)"/><rect width="1200" height="430" rx="34" fill="url(#dots)"/>
  <g font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="62" y="76" fill="#65DCC2" font-size="13" font-weight="760">房间协作 · 实时同步</text><text x="62" y="120" fill="white" font-size="30" font-weight="780">不用来回截图，</text><text x="62" y="161" fill="white" font-size="30" font-weight="780">让每个人自己填。</text><text x="62" y="205" fill="#AFC3D5" font-size="15">发一个房间口令，朋友加入后位置、</text><text x="62" y="231" fill="#AFC3D5" font-size="15">交通方式和方案调整都会同步。</text>
    <g transform="translate(62 276)"><rect width="252" height="76" rx="20" fill="white" fill-opacity=".09" stroke="white" stroke-opacity=".15"/><text x="22" y="27" fill="#9FB7CA" font-size="12">房间口令</text><text x="22" y="55" fill="white" font-size="21" font-weight="760" letter-spacing="5">MID 728</text><rect x="188" y="19" width="44" height="38" rx="12" fill="#168CF8"/><path d="M202 31H218V47H202V31ZM206 27H222V43" stroke="white" stroke-width="2" stroke-linejoin="round"/></g>
  </g>
  <g transform="translate(475 38)" filter="url(#shadow)" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect width="670" height="354" rx="28" fill="#F8FBFE"/><rect x="0" y="0" width="670" height="68" rx="28" fill="white"/><path d="M0 68H670" stroke="#E3ECF4"/><circle cx="34" cy="34" r="15" fill="#0D1A29"/><path d="M26 27C33 27 31 35 37 35C43 35 41 43 48 43" stroke="white" stroke-width="3" stroke-linecap="round"/><circle cx="37" cy="35" r="3.5" fill="#4A9FFF"/><text x="61" y="40" fill="#17324A" font-size="17" font-weight="760">周末见面</text><rect x="530" y="20" width="112" height="30" rx="15" fill="#EAF8F5"/><circle cx="551" cy="35" r="4" fill="#29BE9E"/><text x="563" y="40" fill="#218974" font-size="12" font-weight="650">3 人在线</text>
    <g transform="translate(24 92)"><rect width="294" height="104" rx="20" fill="white" stroke="#DCE7F0"/><circle cx="38" cy="39" r="18" fill="url(#a)"/><text x="38" y="45" text-anchor="middle" fill="white" font-size="13" font-weight="760">我</text><text x="69" y="35" fill="#163149" font-size="15" font-weight="730">我 · 国贸</text><text x="69" y="60" fill="#71869A" font-size="12">已填写 · 公交</text><rect x="212" y="24" width="58" height="25" rx="12.5" fill="#E8FBF6"/><text x="228" y="41" fill="#229B84" font-size="11" font-weight="650">已同步</text><path d="M28 81H264" stroke="#EDF2F6"/><text x="28" y="94" fill="#9AABBA" font-size="11">刚刚更新</text></g>
    <g transform="translate(352 92)"><rect width="294" height="104" rx="20" fill="white" stroke="#DCE7F0"/><circle cx="38" cy="39" r="18" fill="url(#b)"/><text x="38" y="45" text-anchor="middle" fill="white" font-size="13" font-weight="760">林</text><text x="69" y="35" fill="#163149" font-size="15" font-weight="730">朋友 · 清华</text><text x="69" y="60" fill="#71869A" font-size="12">已填写 · 公交</text><rect x="212" y="24" width="58" height="25" rx="12.5" fill="#F2EDFF"/><text x="228" y="41" fill="#7554D1" font-size="11" font-weight="650">已加入</text><path d="M28 81H264" stroke="#EDF2F6"/><text x="28" y="94" fill="#9AABBA" font-size="11">1 分钟前</text></g>
    <g transform="translate(24 218)"><rect width="622" height="106" rx="20" fill="#EDF6FF" stroke="#CFE4F7"/><g transform="translate(20 20) scale(.59)"><path d="M29.2 5.8C41.8 6.7 51.8 14.1 56.2 24.8C47.6 23.2 39.7 26.2 32.4 34.1C26.9 24.6 25.9 15.6 29.2 5.8Z" fill="#7566F2"/><path d="M58.1 28.9C57.1 41.6 49.7 51.6 39 56C40.6 47.4 37.5 39.5 29.7 32.2C39.2 26.7 48.3 25.7 58.1 28.9Z" fill="#2D96F7"/><path d="M35 58.2C22.3 57.2 12.3 49.8 7.9 39.1C16.5 40.7 24.4 37.6 31.7 29.8C37.2 39.3 38.2 48.4 35 58.2Z" fill="#14283E"/><path d="M32 25.2C32.65 29.7 34.3 31.35 38.8 32C34.3 32.65 32.65 34.3 32 38.8C31.35 34.3 29.7 32.65 25.2 32C29.7 31.35 31.35 29.7 32 25.2Z" fill="#8AF0D3"/></g><text x="69" y="34" fill="#163149" font-size="15" font-weight="740">阿觅正在同步重算</text><text x="69" y="59" fill="#638099" font-size="12">新位置已加入，正在比较两人的真实路线…</text><rect x="69" y="76" width="494" height="5" rx="2.5" fill="#D4E6F5"/><rect x="69" y="76" width="358" height="5" rx="2.5" fill="#188CF8"/></g>
  </g>
