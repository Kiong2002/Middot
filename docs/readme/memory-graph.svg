<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">Middot 会面记忆图谱</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#F3F8FD"/><stop offset="1" stop-color="#F7F3FF"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feDropShadow dy="6" stdDeviation="8" flood-color="#188CF8" flood-opacity="0.2"/></filter>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#BED1E3" fill-opacity="0.58"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="30" fill="url(#panel)"/>
  <rect x="24" y="24" width="760" height="312" rx="22" fill="white" fill-opacity="0.68" stroke="#D7E5F2"/>
  <rect x="24" y="24" width="760" height="312" rx="22" fill="url(#dots)"/>
  <rect x="806" y="24" width="370" height="312" rx="22" fill="white" stroke="#D7E5F2"/>

  <g stroke-linecap="round">
    <path d="M300 181L158 94" stroke="#BFD4E7" stroke-width="3"/>
    <path d="M300 181L160 272" stroke="#168CF8" stroke-width="3" stroke-dasharray="8 7"/>
    <path d="M300 181L505 93" stroke="#BFD4E7" stroke-width="3"/>
    <path d="M300 181L533 259" stroke="#F0A53A" stroke-width="3" stroke-dasharray="5 6"/>
    <path d="M505 93L672 170" stroke="#BFD4E7" stroke-width="3"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" text-anchor="middle">
    <g filter="url(#glow)"><circle cx="300" cy="181" r="42" fill="#168CF8"/><text x="300" y="187" fill="white" font-size="16" font-weight="760">我</text></g>
    <g><circle cx="158" cy="94" r="34" fill="#E9F8F6" stroke="#18A998" stroke-width="3"/><text x="158" y="100" fill="#176B63" font-size="14" font-weight="700">阿杰</text></g>
    <g><circle cx="160" cy="272" r="34" fill="#F2EDFF" stroke="#8A68EF" stroke-width="3" stroke-dasharray="7 5"/><text x="160" y="277" fill="#6448BA" font-size="13" font-weight="700">浙大</text></g>
    <g><circle cx="505" cy="93" r="34" fill="#FFF1EA" stroke="#F18C5A" stroke-width="3"/><text x="505" y="99" fill="#A84D28" font-size="13" font-weight="700">小红书</text></g>
    <g><circle cx="533" cy="259" r="34" fill="#FFF7E8" stroke="#EAA02C" stroke-width="3" stroke-dasharray="5 5"/><text x="533" y="264" fill="#9A6410" font-size="13" font-weight="700">黄龙国际</text></g>
    <g><circle cx="672" cy="170" r="34" fill="#EEF5FC" stroke="#7897B3" stroke-width="3"/><text x="672" y="176" fill="#46647F" font-size="13" font-weight="700">常用地点</text></g>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif">
    <text x="840" y="67" fill="#168CF8" font-size="13" font-weight="760">人物 · 待确认</text>
    <text x="840" y="102" fill="#112A42" font-size="26" font-weight="760">阿杰</text>
    <text x="840" y="128" fill="#73889B" font-size="14">2 条直接关系</text>
    <rect x="840" y="154" width="302" height="78" rx="14" fill="#F7FAFD" stroke="#DCE8F3"/>
    <text x="860" y="182" fill="#20384F" font-size="14" font-weight="700">常用出发地</text>
    <rect x="1044" y="168" width="76" height="25" rx="12.5" fill="#EAF5FF"/>
    <text x="1061" y="185" fill="#1477D3" font-size="12" font-weight="650">待确认</text>
    <text x="860" y="213" fill="#61788E" font-size="14">浙江大学紫金港校区</text>
    <rect x="840" y="252" width="82" height="38" rx="12" fill="#168CF8"/><text x="866" y="276" fill="white" font-size="13" font-weight="700">确认</text>
    <rect x="934" y="252" width="112" height="38" rx="12" fill="white" stroke="#CADCEB"/><text x="958" y="276" fill="#36536E" font-size="13" font-weight="650">修改后确认</text>
    <rect x="1058" y="252" width="82" height="38" rx="12" fill="white" stroke="#F0C7C7"/><text x="1084" y="276" fill="#C74949" font-size="13" font-weight="650">忽略</text>
  </g>
</svg>
