<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title">
  <title id="title">通过阿觅对话自然调整会面方案</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500"><stop stop-color="#F7F4FF"/><stop offset=".45" stop-color="#F7FAFD"/><stop offset="1" stop-color="#EEF8FF"/></linearGradient><linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#83BEFF"/><stop offset=".48" stop-color="#3188F5"/><stop offset="1" stop-color="#6357D9"/></linearGradient><filter id="shadow"><feDropShadow dy="9" stdDeviation="14" flood-color="#183B5A" flood-opacity=".12"/></filter><pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#AFC5D9" fill-opacity=".4"/></pattern></defs>
  <rect width="1200" height="500" rx="34" fill="url(#bg)"/><rect width="1200" height="500" rx="34" fill="url(#dots)"/>
  <g transform="translate(46 38)" filter="url(#shadow)" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <rect width="672" height="424" rx="28" fill="white"/><rect width="672" height="70" rx="28" fill="#FCFDFE"/><path d="M0 70H672" stroke="#E1EAF2"/><g transform="translate(21 16) scale(.59)"><path d="M31.7 15.8C25.2 9.5 15.6 10.1 9.9 16.3C4 22.7 4.7 32.9 10.4 39.3C15.2 44.7 22.6 47 29.1 44.8C32 38.9 34.1 32.3 35 25.7C35.5 21.8 34.3 18.4 31.7 15.8Z" fill="#278EF2"/><path d="M32.3 15.8C38.8 9.5 48.4 10.1 54.1 16.3C60 22.7 59.3 32.9 53.6 39.3C48.8 44.7 41.4 47 34.9 44.8C32 38.9 29.9 32.3 29 25.7C28.5 21.8 29.7 18.4 32.3 15.8Z" fill="#7768DF"/><path d="M32 17.7C38.9 23.1 43.3 31.4 42.5 39.6C41.7 47.2 36.8 52.3 32 54.5C27.2 52.3 22.3 47.2 21.5 39.6C20.7 31.4 25.1 23.1 32 17.7Z" fill="#14283E"/><path d="M32 20.8C38 24.5 41.1 30.1 40.5 36.4C39.9 41.9 36.7 46 32 48.4C27.3 46 24.1 41.9 23.5 36.4C22.9 30.1 26 24.5 32 20.8Z" fill="#76D8BF"/><path d="M32 28.1C32.43 30.65 33.35 31.57 35.9 32C33.35 32.43 32.43 33.35 32 35.9C31.57 33.35 30.65 32.43 28.1 32C30.65 31.57 31.57 30.65 32 28.1Z" fill="white"/></g><text x="73" y="31" fill="#142E46" font-size="17" font-weight="760">阿觅</text><text x="73" y="51" fill="#8395A5" font-size="11">你的会面小雷达</text><circle cx="631" cy="35" r="4" fill="#35C4A5"/><text x="568" y="39" fill="#6F879B" font-size="11">正在思考</text>
    <g transform="translate(269 96)"><rect width="365" height="55" rx="20" fill="#158CF7"/><text x="22" y="34" fill="white" font-size="15" font-weight="620">两个人都别太远，想吃火锅</text></g>
    <g transform="translate(28 170)"><rect width="472" height="91" rx="20" fill="#F0F4F7"/><text x="20" y="31" fill="#21394F" font-size="14">找到 3 个更公平的选项。我先按路线</text><text x="20" y="57" fill="#21394F" font-size="14">差排序，再结合你们的火锅偏好。</text><rect x="20" y="67" width="78" height="8" rx="4" fill="#D7E7F5"/><rect x="108" y="67" width="118" height="8" rx="4" fill="#E4DBFB"/><rect x="236" y="67" width="66" height="8" rx="4" fill="#DCEFEA"/></g>
    <g transform="translate(28 280)"><rect width="616" height="115" rx="20" fill="#F8FBFE" stroke="#D9E6F1"/><rect x="18" y="18" width="79" height="79" rx="17" fill="#EAF4FD"/><path d="M34 75C45 55 58 74 75 43" stroke="#188CF8" stroke-width="4" stroke-linecap="round"/><circle cx="58" cy="61" r="7" fill="white" stroke="#188CF8" stroke-width="4"/><text x="116" y="38" fill="#122D45" font-size="16" font-weight="760">火锅店 · 三里屯</text><text x="116" y="64" fill="#71879A" font-size="12">我 32 分钟 · 朋友 35 分钟</text><rect x="116" y="77" width="90" height="25" rx="12.5" fill="#E8FBF6"/><text x="133" y="94" fill="#218F7B" font-size="11" font-weight="650">时间差 3 分钟</text><rect x="503" y="38" width="88" height="39" rx="13" fill="#188CF8"/><text x="527" y="63" fill="white" font-size="13" font-weight="700">看地图</text></g>
  </g>
  <g transform="translate(785 60)" font-family="Inter,-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif">
    <text x="0" y="18" fill="#8464DF" font-size="13" font-weight="760">自然对话 · 随时改方案</text><text x="0" y="64" fill="#102B43" font-size="30" font-weight="780">不用重来，</text><text x="0" y="104" fill="#102B43" font-size="30" font-weight="780">直接告诉阿觅。</text><text x="0" y="147" fill="#6E8396" font-size="15">换菜系、换关键词、改出发地，</text><text x="0" y="173" fill="#6E8396" font-size="15">上下文和地图会一起继续。</text>
    <g transform="translate(0 216)"><rect width="340" height="50" rx="17" fill="white" stroke="#D9E4EF"/><circle cx="27" cy="25" r="8" fill="#52D4B7"/><text x="47" y="30" fill="#274159" font-size="14" font-weight="650">“安静一点”</text></g><g transform="translate(0 278)"><rect width="340" height="50" rx="17" fill="white" stroke="#D9E4EF"/><circle cx="27" cy="25" r="8" fill="#FF9C70"/><text x="47" y="30" fill="#274159" font-size="14" font-weight="650">“换成火锅”</text></g><g transform="translate(0 340)"><rect width="340" height="50" rx="17" fill="white" stroke="#D9E4EF"/><circle cx="27" cy="25" r="8" fill="#9B74F4"/><text x="47" y="30" fill="#274159" font-size="14" font-weight="650">“朋友改从清华出发”</text></g>
  </g>
</svg>
