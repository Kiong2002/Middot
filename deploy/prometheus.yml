global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/middot.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: middot
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:5000"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]
