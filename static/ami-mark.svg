<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">阿觅</title>
  <desc id="desc">三片柔和的寻意光叶围合出一束灵感微光</desc>
  <defs>
    <linearGradient id="ami-iris" x1="28" y1="7" x2="50" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8C7BFF"/>
      <stop offset="1" stop-color="#6254E8"/>
    </linearGradient>
    <linearGradient id="ami-blue" x1="57" y1="29" x2="27" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55B6FF"/>
      <stop offset="1" stop-color="#1688F5"/>
    </linearGradient>
    <linearGradient id="ami-night" x1="8" y1="27" x2="37" y2="55" gradientUnits="userSpaceOnUse">
      <stop stop-color="#243B62"/>
      <stop offset="1" stop-color="#0B1726"/>
    </linearGradient>
    <filter id="ami-shadow" x="-22%" y="-18%" width="144%" height="150%">
      <feDropShadow dy="3" stdDeviation="3" flood-color="#263D79" flood-opacity="0.2"/>
    </filter>
    <filter id="ami-spark-glow" x="-180%" y="-180%" width="460%" height="460%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .ami-aperture { transform-box: fill-box; transform-origin: center; animation: ami-aperture-breathe 6s cubic-bezier(.45,0,.2,1) infinite; }
    .ami-blade { transform-box: fill-box; transform-origin: center; }
    .ami-blade-iris { animation: ami-blade-iris 6s cubic-bezier(.45,0,.2,1) infinite; }
    .ami-blade-blue { animation: ami-blade-blue 6s cubic-bezier(.45,0,.2,1) infinite; }
    .ami-blade-night { animation: ami-blade-night 6s cubic-bezier(.45,0,.2,1) infinite; }
    .ami-spark { transform-box: fill-box; transform-origin: center; animation: ami-spark 3s ease-in-out infinite; }
    @keyframes ami-aperture-breathe { 0%,100% { transform: rotate(-1deg) scale(.985); } 50% { transform: rotate(1.5deg) scale(1.015); } }
    @keyframes ami-blade-iris { 0%,100% { transform: translate(-.35px,.35px); } 50% { transform: translate(.45px,-.5px); } }
    @keyframes ami-blade-blue { 0%,100% { transform: translate(-.25px,-.2px); } 50% { transform: translate(.55px,.35px); } }
    @keyframes ami-blade-night { 0%,100% { transform: translate(.25px,-.15px); } 50% { transform: translate(-.5px,.45px); } }
    @keyframes ami-spark { 0%,100% { opacity:.78; transform: scale(.82) rotate(0deg); } 50% { opacity:1; transform: scale(1.12) rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) { .ami-aperture,.ami-blade,.ami-spark { animation: none !important; } }
  </style>
  <g class="ami-aperture" filter="url(#ami-shadow)">
    <path class="ami-blade ami-blade-iris" d="M29.2 5.8C41.8 6.7 51.8 14.1 56.2 24.8C47.6 23.2 39.7 26.2 32.4 34.1C26.9 24.6 25.9 15.6 29.2 5.8Z" fill="url(#ami-iris)"/>
    <path class="ami-blade ami-blade-blue" d="M58.1 28.9C57.1 41.6 49.7 51.6 39 56C40.6 47.4 37.5 39.5 29.7 32.2C39.2 26.7 48.3 25.7 58.1 28.9Z" fill="url(#ami-blue)"/>
    <path class="ami-blade ami-blade-night" d="M35 58.2C22.3 57.2 12.3 49.8 7.9 39.1C16.5 40.7 24.4 37.6 31.7 29.8C37.2 39.3 38.2 48.4 35 58.2Z" fill="url(#ami-night)"/>
  </g>
  <path class="ami-spark" d="M32 25.2C32.65 29.7 34.3 31.35 38.8 32C34.3 32.65 32.65 34.3 32 38.8C31.35 34.3 29.7 32.65 25.2 32C29.7 31.35 31.35 29.7 32 25.2Z" fill="#8AF0D3" filter="url(#ami-spark-glow)"/>
  <circle cx="32" cy="32" r="1.15" fill="#F8FFFD"/>
</svg>
