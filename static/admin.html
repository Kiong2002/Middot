<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Middot · 管理台</title>
  <style>
    :root{color-scheme:light;--bg:#f4f7fb;--panel:#fff;--line:#e4e9f1;--text:#142033;--muted:#718096;--blue:#0788f5;--blue2:#eaf5ff;--green:#0f9f76;--orange:#d97706;--red:#dc4050;--shadow:0 14px 42px rgba(28,48,82,.10)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input{font:inherit}button{cursor:pointer}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#dcefff 0,transparent 38%)}
    .login-card{width:min(390px,100%);padding:30px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.orb{width:44px;height:44px;border-radius:13px;overflow:hidden;box-shadow:0 7px 18px rgba(11,23,38,.16)}.orb img{display:block;width:100%;height:100%}.brand strong{display:block;font-size:19px}.brand span{color:var(--muted);font-size:12px}
    label{display:block;margin:12px 0 5px;color:#4b5c73;font-size:12px;font-weight:650}.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;outline:0;background:#fbfcfe}.field:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(7,136,245,.12)}
    .primary{width:100%;margin-top:18px;border:0;border-radius:11px;padding:11px;background:var(--blue);color:#fff;font-weight:700}.error{min-height:22px;margin-top:10px;color:var(--red);font-size:12px}
    .app{min-height:100vh}.top{height:66px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(14px)}.top .brand{margin:0}.top-actions{display:flex;align-items:center;gap:8px}.ghost{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;color:#506078}.ghost:hover{border-color:#b8c5d6}.danger{color:var(--red)}
    .layout{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 66px)}.nav{padding:18px 12px;border-right:1px solid var(--line);background:#fff}.nav button{width:100%;text-align:left;border:0;border-radius:10px;padding:10px 12px;margin-bottom:4px;background:transparent;color:#627188}.nav button.active{background:var(--blue2);color:var(--blue);font-weight:700}.main{padding:24px;min-width:0}.section-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}.section-head h1{margin:0;font-size:21px}.section-head p{margin:3px 0 0;color:var(--muted);font-size:12px}.updated{color:var(--muted);font-size:11px}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 4px 14px rgba(28,48,82,.04)}.metric{font-size:28px;font-weight:760;letter-spacing:-.03em}.metric-label{color:var(--muted);font-size:12px}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}
    .panel{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);font-weight:700}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{padding:11px 13px;text-align:left;border-bottom:1px solid #edf0f5;font-size:12px}th{color:#718096;background:#fafbfd;font-weight:650}tr:last-child td{border-bottom:0}.title-cell{max-width:300px;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;padding:2px 7px;border-radius:999px;background:#edf2f7;color:#536174;font-size:10px;font-weight:700}.badge.pending,.badge.retry,.badge.waiting{background:#fff4dd;color:#a45f00}.badge.running{background:#e8f5ff;color:#0879cf}.badge.done{background:#e8f8f2;color:#087b5a}.badge.failed,.badge.conflict{background:#ffeaed;color:#c52d41}.badge.cancelled{background:#f1f3f6;color:#7a8797}.actions{display:flex;gap:5px}.mini{border:1px solid var(--line);border-radius:7px;padding:4px 7px;background:#fff;color:#506078;font-size:11px}.mini:hover{border-color:var(--blue);color:var(--blue)}.mini:disabled{cursor:default;opacity:.42}.empty{padding:34px;text-align:center;color:var(--muted)}.worker{display:flex;align-items:center;justify-content:space-between;gap:12px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;background:#a0aec0}.dot.online{background:var(--green);box-shadow:0 0 0 4px rgba(15,159,118,.12)}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}.candidate-value{max-width:280px;white-space:normal}.hidden{display:none!important}
    .trace-list{display:grid;gap:9px;padding:12px}.trace-row{display:grid;grid-template-columns:90px minmax(180px,1fr) 90px 90px 80px;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}.trace-row:hover{border-color:#b9dfff;background:#fbfdff}.trace-message{min-width:0}.trace-message strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.trace-message span{color:var(--muted);font-size:11px}.timeline{padding:16px 18px}.step{position:relative;margin-left:11px;padding:0 0 18px 25px;border-left:2px solid #e7edf5}.step:last-child{border-left-color:transparent}.step-dot{position:absolute;left:-8px;top:2px;width:14px;height:14px;border:3px solid #fff;border-radius:50%;background:#94a3b8;box-shadow:0 0 0 1px #d7dee8}.step.tool_call .step-dot{background:var(--blue)}.step.tool_result .step-dot{background:var(--green)}.step.error .step-dot{background:var(--red)}.step.waiting .step-dot{background:var(--orange)}.step-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}.step-summary{margin-top:3px;color:#536174;white-space:pre-wrap}.step details{margin-top:8px}.step pre{max-height:320px;overflow:auto;margin:7px 0 0;padding:11px;border-radius:9px;background:#101827;color:#d9e6f2;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}.back{margin-bottom:10px}.trace-head{padding:16px 18px;background:linear-gradient(135deg,#f5faff,#fff)}
    .trace-spans{display:grid;gap:12px;padding:16px}.trace-span{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.trace-span.failed{border-color:#ffc8cf}.trace-span-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;background:#f8fafc;border-bottom:1px solid var(--line)}.trace-span-head strong{display:flex;align-items:center;gap:8px}.trace-kind{display:inline-flex;padding:2px 7px;border-radius:999px;font-size:10px;letter-spacing:.04em}.trace-kind.llm{background:#f0eaff;color:#6d35c5}.trace-kind.tool{background:#e8f5ff;color:#0879cf}.trace-kind.user{background:#e8f8f2;color:#087b5a}.trace-kind.state{background:#fff4dd;color:#a45f00}.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:0}.io-pane{min-width:0;padding:12px 13px}.io-pane+.io-pane{border-left:1px solid var(--line)}.io-label{display:flex;justify-content:space-between;margin-bottom:7px;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.08em}.io-summary{min-height:20px;color:#34445b;white-space:pre-wrap}.trace-span details{margin-top:9px}.trace-span summary{cursor:pointer;color:var(--blue);font-size:11px}.trace-span pre{max-height:440px;overflow:auto;margin:7px 0 0;padding:11px;border-radius:9px;background:#101827;color:#d9e6f2;font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;word-break:break-word}.patches{padding:10px 13px;border-top:1px dashed var(--line);background:#fffcf5}.patches .io-pane{padding:0}.standalone{padding:12px 13px}.trace-tools{display:flex;gap:8px}.trace-live-note{color:var(--muted);font-size:11px}@media(max-width:800px){.io-grid{grid-template-columns:1fr}.io-pane+.io-pane{border-left:0;border-top:1px solid var(--line)}}
    @media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.nav{position:sticky;top:66px;z-index:4;display:flex;gap:5px;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}.nav button{width:auto;white-space:nowrap;margin:0}.main{padding:16px}.top{padding:0 14px}.top .brand span{display:none}}
  </style>
</head>
<body>
  <div class="login-shell" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="brand"><div class="orb"><img src="/static/middot-mark.svg?v=5" alt="Middot"></div><div><strong>Middot 管理台</strong><span>系统与数据管理</span></div></div>
      <label for="username">账号</label><input class="field" id="username" autocomplete="username" value="admin" required>
      <label for="password">密码</label><input class="field" id="password" type="password" autocomplete="current-password" required autofocus>
      <button class="primary" type="submit">登录</button><div class="error" id="loginError"></div>
    </form>
  </div>

  <div class="app hidden" id="appView">
    <header class="top"><div class="brand"><div class="orb"><img src="/static/middot-mark.svg?v=5" alt="Middot"></div><div><strong>Middot 管理台</strong><span>统一管理入口</span></div></div><div class="top-actions"><button class="ghost" id="refreshBtn">刷新</button><button class="ghost danger" id="logoutBtn">退出</button></div></header>
    <div class="layout">
      <nav class="nav" id="nav"><button class="active" data-view="overview">系统总览</button><button data-view="traces">Agent 调用链</button><button data-view="jobs">消息队列</button><button data-view="conversations">历史对话</button><button data-view="candidates">待确认记忆</button></nav>
      <main class="main"><div class="section-head"><div><h1 id="viewTitle">系统总览</h1><p id="viewSub">Middot 后台运行与数据处理状态</p></div><span class="updated" id="updatedAt"></span></div><div id="content"></div></main>
    </div>
  </div>
  <script>
    const S={view:'overview',overview:null,traces:[],traceDetail:null,jobs:[],conversations:[],candidates:[],timer:null};
    const $=s=>document.querySelector(s); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const rel=ts=>{if(!ts)return'—';const d=Math.max(0,Math.floor(Date.now()/1000)-ts);if(d<60)return`${d}秒前`;if(d<3600)return`${Math.floor(d/60)}分钟前`;if(d<86400)return`${Math.floor(d/3600)}小时前`;return`${Math.floor(d/86400)}天前`};
    const bytes=n=>n<1024?`${n} B`:n<1048576?`${(n/1024).toFixed(1)} KB`:`${(n/1048576).toFixed(1)} MB`;
    async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json','X-Middot-Admin':'1'};const r=await fetch(url,opt);let b={};try{b=await r.json()}catch{}if(r.status===401){showLogin();throw new Error('登录已过期')}if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b}
    function showLogin(){clearInterval(S.timer);$('#appView').classList.add('hidden');$('#loginView').classList.remove('hidden');$('#password').focus()}
    function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');loadAll();clearInterval(S.timer);S.timer=setInterval(()=>{if(!document.hidden)loadAll(false)},5000)}
    $('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#username').value,password:$('#password').value})});const b=await r.json();if(!r.ok)throw new Error(b.error||'登录失败');$('#password').value='';showApp()}catch(err){$('#loginError').textContent=err.message}});
    $('#logoutBtn').addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST'})}finally{showLogin()}});$('#refreshBtn').addEventListener('click',()=>loadAll());
    $('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;S.view=b.dataset.view;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));render()});
    async function loadAll(showError=true){try{const [o,t,j,c,m]=await Promise.all([api('/api/admin/memory/overview'),api('/api/admin/agent-traces'),api('/api/admin/memory/jobs'),api('/api/admin/memory/conversations'),api('/api/admin/memory/candidates')]);S.overview=o;S.traces=t.items||[];S.jobs=j.items||[];S.conversations=c.items||[];S.candidates=m.items||[];$('#updatedAt').textContent=`更新于 ${new Date().toLocaleTimeString()}`;if(!S.traceDetail)render()}catch(err){if(showError&&!S.traceDetail)$('#content').innerHTML=`<div class="panel empty red">${esc(err.message)}</div>`}}
    const STATUS_LABELS={pending:'等待执行',retry:'等待重试',running:'执行中',waiting:'等待用户',done:'已完成',failed:'失败',cancelled:'已取消',candidate:'待确认',conflict:'有冲突',active:'正常',deleting:'等待删除'};
    const JOB_LABELS={idle_compile:'闲置整理',manual_compile:'手动整理',compression_compile:'压缩整理',nightly_compile:'夜间补扫',compile_before_delete:'删除前整理'};
    const badge=s=>`<span class="badge ${esc(s)}">${esc(STATUS_LABELS[s]||s)}</span>`;
    function render(){const meta={overview:['系统总览','Middot 后台运行与数据处理状态'],traces:['Agent 调用链','按请求查看用户输入、工具执行、状态更新和最终回复'],jobs:['消息队列','查看、立即执行、重试或取消后台任务'],conversations:['历史对话','查看对话消息与记忆整理水位'],candidates:['待确认记忆','普通对话整理出的候选，不会自动用于规划']}[S.view];$('#viewTitle').textContent=meta[0];$('#viewSub').textContent=meta[1];({overview:renderOverview,traces:renderTraces,jobs:renderJobs,conversations:renderConversations,candidates:renderCandidates}[S.view])()}
    function renderOverview(){const o=S.overview||{},q=o.queue||{},cv=o.conversations||{},ca=o.candidates||{},workers=o.workers||[];$('#content').innerHTML=`<div class="cards"><div class="card"><div class="metric orange">${(q.pending||0)+(q.retry||0)}</div><div class="metric-label">等待/重试任务</div></div><div class="card"><div class="metric ${q.failed?'red':'green'}">${q.failed||0}</div><div class="metric-label">失败任务</div></div><div class="card"><div class="metric">${cv.pending_events||0}</div><div class="metric-label">待整理消息</div></div><div class="card"><div class="metric">${(ca.candidate||0)+(ca.conflict||0)}</div><div class="metric-label">待确认记忆</div></div></div><div class="panel"><div class="panel-head"><span>Worker</span><span>${bytes(o.database_bytes||0)}</span></div>${workers.length?workers.map(w=>`<div class="card worker"><div><span class="dot ${w.online?'online':''}"></span><strong>${w.online?'在线':'离线'}</strong><div class="mono">${esc(w.worker_id)} · PID ${w.pid||'—'}</div></div><div style="text-align:right;color:var(--muted);font-size:11px">心跳 ${rel(w.heartbeat_at)}<br>最近任务 ${rel(w.last_job_at)}</div></div>`).join(''):'<div class="empty">尚未收到Worker心跳</div>'}</div>`}
    function ms(n){if(n==null)return'—';return n<1000?`${n} ms`:`${(n/1000).toFixed(2)} s`}
    function renderTraces(){if(S.traceDetail){renderTraceDetail();return}const rows=S.traces.map(t=>`<button class="trace-row" data-trace="${esc(t.id)}"><span>${badge(t.status)}</span><span class="trace-message"><strong>${esc(t.user_message||'（选择操作）')}</strong><span>用户 ${esc(t.device)} · ${rel(Math.floor(t.started_at/1000))}</span></span><span>${t.tool_count} 个工具</span><span>${ms(t.duration_ms)}</span><span class="mono">${esc(t.id.slice(0,8))}</span></button>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><span>最近请求（${S.traces.length}）</span><span class="updated">自动脱敏 · 点击查看时间线</span></div><div class="trace-list">${rows||'<div class="empty">还没有 Agent 调用记录；新请求会自动出现在这里</div>'}</div></div>`;document.querySelectorAll('[data-trace]').forEach(b=>b.onclick=()=>openTrace(b.dataset.trace))}
    async function openTrace(id){try{S.traceDetail=await api(`/api/admin/agent-traces/${id}`);renderTraceDetail()}catch(err){alert(err.message)}}
    function tracePayload(s,label,open=false){if(!s||s.payload==null)return'';return`<details ${open?'open':''}><summary>${esc(label)}</summary><pre>${esc(JSON.stringify(s.payload,null,2))}</pre></details>`}
    function traceGroups(steps){const out=[];for(let i=0;i<steps.length;i++){const s=steps[i];if(s.step_type==='llm_call'&&steps[i+1]?.step_type==='llm_response'){out.push({kind:'llm',call:s,result:steps[++i],patches:[]});continue}if(s.step_type==='tool_call'){const g={kind:'tool',call:s,result:null,patches:[]};while(i+1<steps.length&&!['tool_call','llm_call','assistant','user','waiting','error'].includes(steps[i+1].step_type)){const n=steps[++i];if(n.step_type==='tool_result'&&!g.result)g.result=n;else g.patches.push(n)}out.push(g);continue}out.push({kind:s.step_type,call:s,result:null,patches:[]})}return out}
    function renderTraceGroup(g){const c=g.call,r=g.result,failed=r&&(r.payload?.ok===false||/失败/.test(r.title||''));if(g.kind==='llm'||g.kind==='tool'){const label=g.kind==='llm'?'LLM':'TOOL',name=g.kind==='llm'?(c.summary||'模型调用'):(c.tool_name||c.title),resultSummary=r?(r.summary||r.title):'尚未返回';return`<section class="trace-span ${failed?'failed':''}"><div class="trace-span-head"><strong><span class="trace-kind ${g.kind}">${label}</span><span>${esc(name)}</span><span class="mono">#${c.seq}${r?`→#${r.seq}`:''}</span></strong><span>${failed?badge('failed'):r?badge('done'):badge('running')} · ${r?.duration_ms!=null?ms(r.duration_ms):'—'}</span></div><div class="io-grid"><div class="io-pane"><div class="io-label"><span>REQUEST · 调用</span><span>${esc(c.title)}</span></div><div class="io-summary">${esc(c.summary||'已发送结构化请求')}</div>${tracePayload(c,'完整请求参数')}</div><div class="io-pane"><div class="io-label"><span>RESPONSE · 返回</span><span>${r?esc(r.title):'等待中'}</span></div><div class="io-summary ${failed?'red':''}">${esc(resultSummary)}</div>${tracePayload(r,'完整原始返回',failed)}</div></div>${g.patches.length?`<div class="patches"><div class="io-label"><span>STATE · 状态变化</span><span>${g.patches.length} 项</span></div>${g.patches.map(p=>`<div class="io-summary">${esc(p.title)} · ${esc(p.summary||'')}</div>${tracePayload(p,'完整状态数据')}`).join('')}</div>`:''}</section>`}const labels={user:'USER',assistant:'FINAL',waiting:'WAIT',error:'ERROR',state_patch:'STATE'};return`<section class="trace-span ${g.kind==='error'?'failed':''}"><div class="trace-span-head"><strong><span class="trace-kind ${g.kind==='user'||g.kind==='assistant'?'user':'state'}">${labels[g.kind]||esc(g.kind.toUpperCase())}</span><span>${esc(c.title)}</span><span class="mono">#${c.seq}</span></strong><span>${c.duration_ms!=null?ms(c.duration_ms):''}</span></div><div class="standalone"><div class="io-summary ${g.kind==='error'?'red':''}">${esc(c.summary||'')}</div>${tracePayload(c,'完整数据',g.kind==='error')}</div></section>`}
    function renderTraceDetail(){const d=S.traceDetail,t=d.trace,groups=traceGroups(d.steps||[]);$('#content').innerHTML=`<div class="trace-tools back"><button class="mini" id="traceBack">← 返回调用列表</button><button class="mini" id="traceReload">刷新本条</button><span class="trace-live-note">查看详情时不会自动重绘，展开内容不会再自行收起</span></div><div class="panel"><div class="trace-head"><div>${badge(t.status)} <span class="mono">${esc(t.id.slice(0,12))}</span></div><h3>${esc(t.user_message||'（选择操作）')}</h3><div class="updated">用户 ${esc(t.device)} · ${t.tool_count} 次工具调用 · 总耗时 ${ms(t.duration_ms)}</div>${t.error?`<div class="red">${esc(t.error)}</div>`:''}</div><div class="trace-spans">${groups.map(renderTraceGroup).join('')||'<div class="empty">暂无步骤</div>'}</div></div>`;$('#traceBack').onclick=()=>{S.traceDetail=null;renderTraces()};$('#traceReload').onclick=()=>openTrace(t.id)}
    function renderJobs(){const rows=S.jobs.map(j=>`<tr><td>#${j.id}</td><td>${badge(j.status)}</td><td title="${esc(j.job_type)}">${esc(JOB_LABELS[j.job_type]||j.job_type)}</td><td class="title-cell" title="${esc(j.title||j.conversation_id)}">${esc(j.title||j.conversation_id)}</td><td>${j.last_compiled_seq??'—'} → ${j.target_seq}</td><td>${j.attempts}</td><td>${j.run_after>Math.floor(Date.now()/1000)?`${Math.ceil((j.run_after-Date.now()/1000)/60)}分钟后`:rel(j.run_after)}</td><td class="actions">${j.status!=='running'?`<button class="mini" data-job="${j.id}" data-action="run">立即执行</button>`:''}${['pending','retry','failed'].includes(j.status)?`<button class="mini danger" data-job="${j.id}" data-action="cancel">取消</button>`:''}</td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head"><span>任务（${S.jobs.length}）</span><button class="mini" id="cleanupJobs">清理已完成</button></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>状态</th><th>类型</th><th>对话</th><th>范围</th><th>尝试</th><th>执行时间</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">没有任务</td></tr>'}</tbody></table></div></div>`;$('#cleanupJobs').onclick=()=>act('/api/admin/memory/jobs/cleanup','POST');document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>act(`/api/admin/memory/jobs/${b.dataset.job}/${b.dataset.action}`,'POST',b.dataset.action==='cancel'))}
    function renderConversations(){const rows=S.conversations.map(c=>{const pending=Math.max(0,c.last_seq-c.last_compiled_seq);return`<tr><td>${badge(c.status)}</td><td class="title-cell">${esc(c.title)}</td><td class="mono">${esc(c.device)}</td><td>${c.last_seq}</td><td>${c.last_compiled_seq}</td><td class="${pending?'orange':''}">${pending}</td><td>${rel(c.last_activity_at)}</td><td><button class="mini" data-compile="${esc(c.id)}" ${pending?'':'disabled'}>立即整理</button></td></tr>`}).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head">对话（${S.conversations.length}）</div><div class="table-wrap"><table><thead><tr><th>状态</th><th>标题</th><th>设备</th><th>last_seq</th><th>compiled</th><th>待整理</th><th>最后活动</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">没有持久对话</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-compile]').forEach(b=>b.onclick=()=>act(`/api/admin/memory/conversations/${b.dataset.compile}/compile`,'POST'))}
    function renderCandidates(){const rows=S.candidates.map(c=>`<tr><td>${badge(c.status)}</td><td>${esc(c.kind)}</td><td>${esc(c.entity_key)}</td><td>${esc(c.field_name)}</td><td class="candidate-value">${esc(c.candidate_value)}</td><td>${Math.round(c.confidence*100)}%</td><td>${c.source_from_seq||'—'}–${c.source_to_seq||'—'}</td><td><button class="mini danger" data-dismiss="${c.id}">忽略</button></td></tr>`).join('');$('#content').innerHTML=`<div class="panel"><div class="panel-head">候选（${S.candidates.length}）</div><div class="table-wrap"><table><thead><tr><th>状态</th><th>类型</th><th>实体</th><th>字段</th><th>候选值</th><th>置信度</th><th>来源seq</th><th>操作</th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="empty">没有待确认记忆</td></tr>'}</tbody></table></div></div>`;document.querySelectorAll('[data-dismiss]').forEach(b=>b.onclick=()=>act(`/api/admin/memory/candidates/${b.dataset.dismiss}/dismiss`,'POST',true))}
    async function act(url,method,confirmFirst=false){if(confirmFirst&&!confirm('确认执行这个操作？'))return;try{await api(url,{method});await loadAll()}catch(err){alert(err.message)}}
    fetch('/api/admin/session').then(r=>r.json()).then(s=>s.authenticated?showApp():showLogin()).catch(showLogin);
  </script>
</body>
</html>
